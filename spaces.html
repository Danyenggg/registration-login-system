<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find a space | StudySpace</title><link rel="stylesheet" href="study.css"></head><body><header class="top"><a class="brand" href="index.html">Study<b>Space</b></a><button class="mobile btn" id="menu">☰</button><nav id="nav"><a href="study-dashboard.html">Dashboard</a><a href="spaces.html">Find a space</a><a href="reservations.html">My reservations</a><a href="admin.html" id="adminLink" hidden>Admin</a><a href="#" id="logout" class="btn">Log out</a></nav></header><main class="wrap"><div class="pagehead"><div><span class="eyebrow">FIND YOUR FOCUS</span><h1>Explore study spaces</h1><p class="muted">Choose a space and reserve a time.</p></div></div><div class="toolbar"><input id="search" placeholder="Search spaces…"><select id="type"><option value="all">All types</option><option>Quiet Room</option><option>Group Table</option><option>Group Room</option><option>Focus Pod</option></select></div><div class="grid spaces" id="spaceGrid"></div><section class="panel" id="bookingPanel" hidden style="margin-top:25px"><div class="pagehead"><div><span class="eyebrow">RESERVE YOUR SPOT</span><h2 id="bookTitle">Book a space</h2><p class="muted" id="bookInfo"></p></div><button class="btn" id="close">Close</button></div><form id="bookForm"><input id="sid" type="hidden"><div class="fieldgrid"><div class="field"><label for="day">Date</label><input id="day" type="date" required></div><div class="field"><label for="start">Start time</label><select id="start"><option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option><option>18:00</option></select></div><div class="field"><label for="duration">Duration</label><select id="duration"><option value="1">1 hour</option><option value="2">2 hours</option><optio

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Registration Form Activity</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h2>Registration Form</h2>
    <form id="registerform" onsubmit="return validateForm()">

        <label for="fullname">Full Name *</label>
        <input type="text" id="fulname" name="fullname" placeholder="Enter your full name" required=""/>

        <label for="username">Username *</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required=""/>

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required=""/>

        <label for="contact">Contact Number *</label>
        <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required="[0-9]{11}" maxlength="11"/>

        <label for="address">Address *</label>
        <input type="text" id="address" name="address" placeholder="Enter your address" required=""/>

        
<label for="password">Create Your Password *</label>
<input type="password" id="password" name="password" placeholder="Create your password" required=""/>

<div id="passwordRequirements" class="password-requirements">
    <p>Password must contain:</p>
    <ul>
        <li id="reg-length">At least 8 characters</li>
        <li id="reg-upper">One uppercase letter (A-Z)</li>
        <li id="reg-lower">One lowercase letter (a-z)</li>
        <li id="reg-number">One number (0-9)</li>
        <li id="reg-special">One special character (!@#$% etc.)</li>
    </ul>
</div>

<div id="confirmPasswordGroup" style="display: none;">
    <label for="confirmPassword">Re-enter Password *</label>
    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" disabled/>
</div>

<span id="passwordError"></span>

        
        <label for="birthdate">Birthdate *</label>
        <input type="date" id="birthdate" name="birthdate" required=""/>

        <label>Gender *</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="Male"/> Male</label>
            <label><input type="radio" name="gender" value="Female"/> Female</label>
        </div>

        <label>Course/Year & Section:</label>
        <div class="course-year-section">
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BLIS">BLIS</option>
            </select>

            <select id="year" name="year">
                <option value="">Select Year</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <select id="section" name="section">
                <option value="">Select Section</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="terms" name="terms" required=""/> I agree to the Terms & Conditions *</label>
        </div>

        <div class="button-group">
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </div>
    </form>

    <script src="form.js"></script>
</body>
</html>

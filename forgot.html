
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgot.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
    <div class="container">
    <h2>Forgot Password</h2>

    <form onsubmit="return false;">
        <label for="account">Username or Email</label>
        <input
            type="text"
            id="account"
            placeholder="Enter your username or email"
            required
        >

        <button type="button" id="continueButton" onclick="verifyAccount()">
            Continue
        </button>

        <p id="message" role="status" aria-live="polite"></p>

        
        <div id="otpSection" style="display: none;">

            <label for="otp">Verification Code</label>
            <input
                type="text"
                id="otp"
                placeholder="Enter the 6-digit code sent to your email"
                inputmode="numeric"
                maxlength="6"
                autocomplete="one-time-code"
            >

            <button type="button" id="verifyOTPButton" onclick="verifyOTP()">
                Verify Code
            </button>

        </div>

        
<div id="resetPassword" style="display: none;">

    <label for="newPassword">Create Your New Password</label>
    <input
        type="password"
        id="newPassword"
        placeholder="Create your new password"
        autocomplete="new-password"
    >

    <div id="forgotPasswordRequirements" class="password-requirements">
        <p>Password must contain:</p>
        <ul>
            <li id="forgot-length">At least 8 characters</li>
            <li id="forgot-upper">One uppercase letter (A-Z)</li>
            <li id="forgot-lower">One lowercase letter (a-z)</li>
            <li id="forgot-number">One number (0-9)</li>
            <li id="forgot-special">One special character</li>
        </ul>
    </div>

    <div id="forgotConfirmGroup" style="display: none;">
        <label for="confirmPassword">Re-enter Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your new password"
            autocomplete="new-password"
            disabled
        >
    </div>

    <div class="button-group">
        <button type="button" onclick="changePassword()">
            Reset Password
        </button>

        <button
            type="button"
            onclick="window.location.href='login.html'"
        >
            Cancel
        </button>
    </div>

</div>

        <p>
            <a href="login.html">Back to Login</a>
        </p>
    </form>
    </div>

    <script src="forgot.js"></script>

</body>
</html>

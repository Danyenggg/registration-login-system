<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>
    
    <link rel="stylesheet" href="css_dashboard.css">
   
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="main-container">
        
        <header>
            <h2>Finance Tracker</h2>
            <h1 id="welcomeText"></h1>
            <p>Track your finances easily</p>
        </header>

        
        <div class="balance-container">
            <div class="card">
                <h3>Your Balance</h3>
                <h2 id="balance">$0.00</h2>
            </div>
            <div class="card">
                <h3>Income</h3>
                <h2 id="money-plus" class="money plus">+$0.00</h2>
            </div>
            <div class="card">
                <h3>Expenses</h3>
                <h2 id="money-minus" class="money minus">-$0.00</h2>
            </div>
        </div>

      
        <div class="chart-container">
            <div class="card">
                <h3>Income vs Expenses</h3>
                <canvas id="financeChart"></canvas>
            </div>
        </div>

      
        <div class="form-container">
            <div class="card">
                <h3>Add New Transaction</h3>
                <form id="form">
                    <div class="form-group">
                        <label for="text">Description</label>
                        <input type="text" id="text" placeholder="Enter description..." required />
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Salary">Salary</option>
                            <option value="Travel">Travel</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">
                            Amount <br />
                            (negative - expense, positive - income)
                        </label>
                        
                        <input type="number" id="amount" placeholder="Enter amount..." required />
                    </div>

                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <button class="btn">Add Transaction</button>
                </form>
            </div>
        </div>

        
        <div class="history-container">
            <div class="card">
                <div class="history-header">
                    <h3>History</h3>
                    <select id="filterCategory" onchange="filterTransactions()">
                        <option value="all">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Salary">Salary</option>
                        <option value="Travel">Travel</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
                <ul id="list" class="list">
                    
                </ul>
            </div>
        </div>
    </div>

    
    <script src="jscript_dashboard.js"></script>
</body>
</html>
